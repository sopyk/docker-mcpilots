<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Docker-MCPilotS{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/ui/static/fonts.css?v=1">
    <link rel="stylesheet" href="/ui/static/tokens.css?v=7">
    <link rel="stylesheet" href="/ui/static/style.css?v=7">
    <link rel="stylesheet" href="/ui/static/mobile.css?v=3">
    <link rel="icon" type="image/jpeg" href="/ui/static/assets/favicon.jpg">
    <!-- 剪贴板工具：需在页面内联脚本之前加载 -->
    <script src="/ui/static/clipboard.js?v=1"></script>
    <!-- 首屏关键 CSS：确保 JS 加载前汉堡按钮在手机上可见 -->
    <style>
        @media (max-width: 768px) {
            #hamburger { display: inline-flex !important; }
        }
    </style>
</head>
<body>
{% block navbar %}
<nav class="navbar">
    <a href="/ui/" class="brand">
        <img src="/ui/static/assets/logo.jpg" alt="Docker-MCPilotS Logo" class="logo">
        <span class="status-dot"></span>
        Docker-MCPilotS
    </a>
    <button class="hamburger" id="hamburger" aria-label="导航菜单"><span class="ham-bar"></span><span class="ham-bar"></span><span class="ham-bar"></span></button>
    <div class="theme-select" id="theme-select">
        <button class="theme-toggle" id="theme-toggle" aria-label="主题设置" type="button">🌓</button>
        <div class="theme-dropdown" id="theme-dropdown">
            <div class="theme-option" data-theme="system">跟随系统</div>
            <div class="theme-option" data-theme="light">浅色</div>
            <div class="theme-option" data-theme="dark">深色</div>
        </div>
    </div>
    <div class="nav-links" id="nav-links">
        {% if user %}
            <a href="/ui/">仪表盘</a>
            <a href="/ui/containers">容器</a>
            <a href="/ui/images">镜像</a>
            <a href="/ui/users">用户</a>
            <a href="/ui/audit">操作日志</a>
            <a href="/ui/settings">设置</a>
            <a href="/ui/logout">退出</a>
        {% else %}
            <a href="/ui/login">登录</a>
        {% endif %}
        <a href="/ui/about">关于</a>
        <span class="version-tag">v{{ app_version }}</span>
    </div>
</nav>
{% endblock %}
{% block body %}{% endblock %}
<script>
// 移除URL中的查询参数（success/error）
(function() {
    if (window.location.search) {
        const url = new URL(window.location.href);
        url.search = '';
        window.history.replaceState({}, document.title, url.toString());
    }
})();

// 汉堡菜单
(function() {
    var btn = document.getElementById('hamburger');
    var nav = document.getElementById('nav-links');
    if (btn && nav) {
        btn.style.display = '';
        btn.addEventListener('click', function(e) {
            e.stopPropagation();
            nav.classList.toggle('open');
            btn.classList.toggle('active');
        });
        document.addEventListener('click', function(e) {
            if (!nav.contains(e.target) && e.target !== btn) {
                nav.classList.remove('open');
                btn.classList.remove('active');
            }
        });
    }
})();

// 主题切换（跟随系统 / 白天 / 黑夜）
(function() {
    var toggle = document.getElementById('theme-toggle');
    var dropdown = document.getElementById('theme-dropdown');
    var html = document.documentElement;
    var options = dropdown.querySelectorAll('.theme-option');
    var media = window.matchMedia('(prefers-color-scheme: light)');

    // 应用主题
    function applyTheme(mode) {
        if (mode === 'light') {
            html.setAttribute('data-theme', 'light');
            toggle.textContent = '☀️';
        } else if (mode === 'dark') {
            html.removeAttribute('data-theme');
            toggle.textContent = '🌙';
        } else {
            // system：按系统偏好
            if (media.matches) {
                html.setAttribute('data-theme', 'light');
                toggle.textContent = '☀️';
            } else {
                html.removeAttribute('data-theme');
                toggle.textContent = '🌙';
            }
        }
        // 高亮当前选中项
        options.forEach(function(opt) {
            if (opt.getAttribute('data-theme') === mode) {
                opt.classList.add('active');
            } else {
                opt.classList.remove('active');
            }
        });
    }

    // 初始化：读取本地存储，没有则默认 system
    var saved = localStorage.getItem('theme') || 'system';
    applyTheme(saved);

    // 系统主题变化时，仅在 system 模式下自动跟随
    media.addEventListener('change', function(e) {
        if (localStorage.getItem('theme') === 'system' || !localStorage.getItem('theme')) {
            applyTheme('system');
        }
    });

    // 点击按钮打开/关闭下拉
    toggle.addEventListener('click', function(e) {
        e.stopPropagation();
        dropdown.classList.toggle('open');
    });

    // 点击选项
    options.forEach(function(opt) {
        opt.addEventListener('click', function(e) {
            e.stopPropagation();
            var mode = opt.getAttribute('data-theme');
            localStorage.setItem('theme', mode);
            applyTheme(mode);
            dropdown.classList.remove('open');
        });
    });

    // 点击页面其他地方关闭下拉
    document.addEventListener('click', function(e) {
        if (!dropdown.contains(e.target) && e.target !== toggle) {
            dropdown.classList.remove('open');
        }
    });
})();

</script>
</body>
</html>
