name: Sync Code to Gitee

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-code:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source (GitHub)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add Gitee remote
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          git remote add gitee https://oauth2:${GITEE_TOKEN}@gitee.com/sopyk/docker-mcpilots.git

      - name: Push branches to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -x
          echo "=== Gitee remote URL ==="
          git remote -v
          echo "=== Testing Gitee token ==="
          curl -s -H "Authorization: token ${GITEE_TOKEN}" https://gitee.com/api/v5/user | jq .login
          echo "=== Pushing branches ==="
          # 同步指定分支（fast-forward，不 force）
          for branch in main dev; do
            echo "Pushing $branch..."
            git push gitee "refs/heads/$branch:refs/heads/$branch" 2>&1 || true
          done
          # 同步所有 tags（包含 release tag）
          echo "Pushing tags..."
          git push gitee --tags 2>&1 || true