name: Sync Release to Gitee

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source (GitHub)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add Gitee remote
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          git remote add gitee https://oauth2:${GITEE_TOKEN}@gitee.com/sopyk/docker-mcpilots.git

      - name: Sync release tag to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          # 获取刚发布的 tag 名（release 事件时可用；workflow_dispatch 时需手动指定）
          TAG="${{ github.event.release.tag_name }}"
          if [ -z "$TAG" ]; then
            echo "⚠️ 手动触发模式：请在 workflow_dispatch inputs 中指定 tag，或改用 release 事件"
            exit 1
          fi
          echo "Syncing release tag: $TAG"

          # 推送该 tag 到 Gitee（包含 commit 对象）
          git push gitee "refs/tags/$TAG:refs/tags/$TAG"

          # 可选：把 release body 也同步到 Gitee Release（需要 Gitee API）
          # 这里仅演示 tag 同步；如需完整 Release 同步，可集成现成 action